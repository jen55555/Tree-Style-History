<!DOCTYPE html>
<html>

<head>
    <meta content="text/html; charset=utf-8" http-equiv="Content-Type">
    <title>Tree Style History</title>
    <link rel="stylesheet" href="css/history.css">
    <script src="scripts/storage-adapter.js"></script>
    <script src="scripts/message-adapter.js"></script>
    <script src="scripts/db-manager.js"></script>
    <script src="scripts/history-rtl.js"></script>
    <script type="module" src="scripts/history2.js"></script>

    <!-- Still zTree's stylesheet: the native renderer in scripts/modules/tree.js
         emits zTree's class vocabulary, so the icons, the connector line and
         the indentation are this file's. What is gone is the library itself —
         jQuery, jquery.ztree.core.js, the locally patched exhide extension and
         fuzzysearch.js. -->
    <link rel="stylesheet" href="css/zTreeStyle.css" type="text/css">
</head>

<body class="tree-view">
    <div id="navigation-menu">
        <h1 class="lang" data-lang-string="treeOptions"></h1>
        <ul>
            <li><a href="history2.html" class="lang selected" data-lang-string="treeOptions"></a></li>
            <li><a href="history.html" class="lang" data-lang-string="linerHistory"></a></li>
            <li><a href="closed.html" class="lang" data-lang-string="closeHistory"></a></li>
            <li><a href="bookmark.html" class="lang" data-lang-string="linerBookMark"></a></li>
            <li><a href="options.html" class="lang" data-lang-string="options"></a></li>
            <li><a href="#" id="menu-drive-backup" class="lang" data-lang-string="googleDriveBackup"></a></li>
            <li><a href="#" id="menu-trash-recovery" class="lang" data-lang-string="trashRecovery"></a></li>
        </ul>

    </div>

    <div id="history-container" class="tree-view">
        <table id="main-table">
            <tr>
                <td>
                    <h1 class="lang" id="header-text" data-lang-string="allHistory"></h1>
                </td>
                <td id="search">
                    <div id="adv-search-container">
                        <div class="search-primary-bar">
                            <input id="rh-search" type="text" placeholder="Filter / ค้นหา..." value="" class="search-box">
                            <button id="btn-toggle-adv" type="button" class="btn-adv-toggle" title="Advanced Search">
                                <span class="lang" data-lang-string="advancedSearch">⚙ ค้นหาละเอียด</span>
                            </button>
                            <button id="btn-clear-search" type="button" class="btn-adv-clear" title="Clear">✕</button>
                        </div>
                        <div id="adv-search-drawer" style="display:none;">
                            <div class="adv-row">
                                <div class="adv-col">
                                    <label class="adv-field-label" for="rh-search-source">
                                        <span class="badge-source-label lang" data-lang-string="searchSource">ต้นทาง (Origin/Source)</span>:
                                    </label>
                                    <input id="rh-search-source" type="text" class="search-box adv-input" placeholder="ค้นหาเว็บต้นทาง เช่น google, reddit...">
                                </div>
                                <div class="adv-arrow-col">➔</div>
                                <div class="adv-col">
                                    <label class="adv-field-label" for="rh-search-dest">
                                        <span class="badge-dest-label lang" data-lang-string="searchDestination">ปลายทาง (Destination)</span>:
                                    </label>
                                    <input id="rh-search-dest" type="text" class="search-box adv-input" placeholder="ค้นหาเว็บปลายทาง เช่น github, vite...">
                                </div>
                                <div class="adv-col adv-col-trans">
                                    <label class="adv-field-label" for="rh-search-trans">
                                        <span class="lang" data-lang-string="searchTransition">ประเภท:</span>
                                    </label>
                                    <select id="rh-search-trans" class="select adv-select">
                                        <option value="">ทั้งหมด (All)</option>
                                        <option value="link">🔗 Link (ลิงก์)</option>
                                        <option value="typed">⌨ Typed (พิมพ์)</option>
                                        <option value="auto_bookmark">☆ Bookmark</option>
                                        <option value="reload">🔄 Reload</option>
                                        <option value="keyword">🔍 Search</option>
                                    </select>
                                </div>
                            </div>
                            <div class="adv-row adv-row-date">
                                <div class="adv-col">
                                    <label class="adv-field-label" for="rh-search-start-date">
                                        <span class="badge-date-label lang" data-lang-string="searchStartDate">📅 วันเริ่มหา (Start Date)</span>:
                                    </label>
                                    <input id="rh-search-start-date" type="date" class="search-box adv-input adv-date-input">
                                </div>
                                <div class="adv-arrow-col">➔</div>
                                <div class="adv-col">
                                    <label class="adv-field-label" for="rh-search-end-date">
                                        <span class="badge-date-label lang" data-lang-string="searchEndDate">📅 วันที่สิ้นสุด (End Date)</span>:
                                    </label>
                                    <input id="rh-search-end-date" type="date" class="search-box adv-input adv-date-input">
                                </div>
                                <div class="adv-col adv-col-presets">
                                    <label class="adv-field-label">
                                        <span class="lang" data-lang-string="quickDateFilter">ช่วงเวลาด่วน:</span>
                                    </label>
                                    <div class="date-presets-btn-group">
                                        <button type="button" class="btn-preset-date lang" data-preset="today" data-lang-string="todayPreset">วันนี้</button>
                                        <button type="button" class="btn-preset-date lang" data-preset="yesterday" data-lang-string="yesterdayPreset">เมื่อวาน</button>
                                        <button type="button" class="btn-preset-date lang" data-preset="7days" data-lang-string="last7DaysPreset">7 วัน</button>
                                        <button type="button" class="btn-preset-date lang" data-preset="30days" data-lang-string="last30DaysPreset">30 วัน</button>
                                        <button type="button" class="btn-preset-date lang" data-preset="all" data-lang-string="allTimePreset">ทั้งหมด</button>
                                    </div>
                                </div>
                            </div>
                            <div id="adv-search-summary" class="adv-summary" style="display:none;"></div>
                        </div>
                    </div>
                </td>
            </tr>

            <tr>

                <td colspan="2">
                    <a href="#" class="lang" data-lang-string="showCalendar" id='showCalendar'></a>
                    <div id="rh-views">
                        <ul id="treeDemo" class="ztree"  ></ul>
<!--                         <div id='rh-views-tube'>
                           
                        </div>
                     -->
                    </div>

                    <!--         <div id="rh-bar">
          <label id="rh-bar-uione"><input id="master-check-all" type="checkbox" name="checkall" value="false"></label>
          <a id="rh-bar-group" href="#"></a>
          <a id="rh-bar-orderby" href="#"></a>
          <a id="rh-bar-order" href="#"></a>
          &nbsp;
        </div>
        <div id="rh-views">
          <div id="rh-views-tube">
            <div id="rh-views-insert"></div>
            <div id="rh-views-search-insert"></div>
          </div>
        </div> -->
                </td>
            </tr>
        </table>
        <div id="calendar" class="calendar2">
            <!--     <a id="delete-range-toggle-button" href="#"></a> -->
            <table id="calendar-table">
                <tr>
                    <td id="calendar-left">
                        <input type="text" id="delete-range-one" name="delete-range-one" value=""><br>
                        <input type="text" id="delete-range-two" name="delete-range-two" value=""><br>
                        <input id="delete-range-button" class="button" type="button" value="">
                    </td>
                    <td id="calendar-right">
                        <div id="calendar-nav">
                            <span id="dsdi"></span>
                            <span id="dsmi"></span>
                            <span id="dsyi"></span>
                        </div>
                        <div id="calendar-week">
                            <span class="day lang" data-lang-string="sundayLetter"></span>
                            <span class="day lang" data-lang-string="mondayLetter"></span>
                            <span class="day lang" data-lang-string="tuesdayLetter"></span>
                            <span class="day lang" data-lang-string="wednesdayLetter"></span>
                            <span class="day lang" data-lang-string="thursdayLetter"></span>
                            <span class="day lang" data-lang-string="fridayLetter"></span>
                            <span class="day lang" data-lang-string="saturdayLetter"></span>
                        </div>
                        <div id="calendar-days"></div>
                        <!--   <div id="calendar-freq"><img class="non-retina" alt="Frequency" src="images/legend.gif"><img class="retina" alt="Frequency" src="images/legend-@2x.gif"></div>
 -->
                        <div id="calendar-total"><span class="lang" data-lang-string="totalHistoryItems"></span> <span
                                id="calendar-total-value">0</span>

                            <form id="rh-search-form" action="#">
                                <!--           <span id="rh-clear-search">&times;</span> -->
                                <input id="rh-search" type="text" placeholder="Filter" value="">
                                <p>
                                <div id="search-tag">
                                    <a href="#" class="tag ">🔗</a>
                                    <a href="#" class="tag ">⌨</a>
                                    <a href="#" class="tag ">☆</a>
                                    <a href="#" class="tag ">🧭</a>
                                    <a href="#" class="tag ">🏠</a>
                                    <a href="#" class="tag ">⏫</a>
                                    <a href="#" class="tag ">🔄</a>
                                    <a href="#" class="tag ">🔍</a>
                                </div>
                                </p>
                                <!--                   <select class="select" id="rh-what">
                    <option value="all" class="lang" data-lang-string="allHistory"></option>
                 <option value="recent" class="lang" data-lang-string="recentHistory"></option>
                    <option value="current" class="lang" data-lang-string="currentHistory"></option> 
                  </select> -->
                            </form>

                        </div>
                        <!--           <div id="calendar-delete"><input id="delete-button" class="button" type="button" value=""></div> -->
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <div id="alert-holder">
        <img id="alert-holder-loading" alt="Loading" src="images/loading.gif">
    </div>
</body>

</html>
